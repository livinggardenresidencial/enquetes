<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comissão de Melhorias · Living Garden</title>
  <meta name="description" content="Enquetes do Residencial Living Garden: vote pelo seu apartamento em menos de 1 minuto e acompanhe o resultado ao vivo.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f8ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11160c" media="(prefers-color-scheme: dark)">
  <!-- Como o link aparece ao ser compartilhado no WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Enquete da Comissão de Melhorias · Living Garden">
  <meta property="og:description" content="Vote pelo seu apartamento em menos de 1 minuto e acompanhe o resultado ao vivo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d6e17'/%3E%3Cpath d='M8 24C8 14 14 8 24 8c0 10-6 16-16 16z' fill='%23fff'/%3E%3Cpath d='M8 24l9-9' stroke='%233d6e17' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <div class="marca" data-marca>
        <svg class="emblema" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" class="emblema-fundo"/>
          <path d="M8 24C8 14 14 8 24 8c0 10-6 16-16 16z" class="emblema-folha"/>
          <path d="M8 24l9-9" class="emblema-veio"/>
        </svg>
        <span class="condominio" data-condominio>Condomínio</span>
      </div>
      <h1 data-comissao>Enquetes</h1>
      <p>Sua opinião orienta as próximas melhorias. Um voto por apartamento, em menos de 1 minuto.</p>
    </header>

    <main class="lista">
      <p id="estado" class="so-leitor" role="status">Carregando enquetes…</p>

      <section class="lista" aria-labelledby="t-abertas">
        <h2 id="t-abertas" class="secao-titulo">Em votação</h2>
        <div id="abertas" class="lista">
          <div class="enquete esqueleto" aria-hidden="true">
            <span class="osso" style="width:32%"></span>
            <span class="osso alto" style="width:88%"></span>
            <span class="osso" style="width:70%"></span>
            <span class="osso bloco"></span>
            <span class="osso bloco"></span>
            <span class="osso bloco"></span>
          </div>
        </div>
      </section>

      <section id="secao-encerradas" class="lista" aria-labelledby="t-encerradas" hidden>
        <h2 id="t-encerradas" class="secao-titulo">Encerradas</h2>
        <div id="encerradas" class="lista"></div>
      </section>
    </main>

    <footer class="rodape">
      O site mostra apenas os totais. O nome de quem votou e o voto de cada apartamento ficam visíveis só para a comissão.
      · <a href="admin.html">Administração</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/comum.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
